<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Simples</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .calculadora { max-width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 5px; }
        input, select, button { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        #resultado { font-weight: bold; color: green; font-size: 1.2em; }
    </style>
</head>
<body>

    <div class="calculadora">
        <h3>Calculadora</h3>
        
        <input type="number" id="num1" placeholder="Primeiro número">
        
        <select id="operacao">
            <option value="soma">Somar (+)</option>
            <option value="subtracao">Subtrair (-)</option>
            <option value="multiplicacao">Multiplicar (*)</option>
            <option value="divisao">Dividir (/)</option>
        </select>
        
        <input type="number" id="num2" placeholder="Segundo número">
        
        <button onclick="calcular()">Calcular</button>
        
        <p>Resultado: <span id="resultado">0</span></p>
    </div>

    <script src="calculadora.js"></script>
</body>
</html>
